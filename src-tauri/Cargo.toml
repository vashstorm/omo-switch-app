[package]
name = "omo-switch"
version = "0.3.0"
edition = "2021"
description = "OMO Switch Desktop App"
authors = ["OMO Team"]
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
log = "0.4"
simplelog = "0.12"
jsonc-parser = { version = "0.32", features = ["cst", "serde_json"] }
tauri-plugin-window-state = "2.4.1"
indexmap = { version = "2", features = ["serde"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-opener = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

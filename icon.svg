<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Deep Obsidian Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glass Surface Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <!-- Neon Accent Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Square -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Pattern for 'Tech' feel -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-width="0.5" stroke-opacity="0.05" />
  </pattern>
  <rect width="512" height="512" rx="128" fill="url(#grid)" />

  <!-- Central Glow -->
  <circle cx="256" cy="256" r="140" fill="url(#neonGrad)" fill-opacity="0.1" filter="url(#glow)" />

  <!-- Main Symbol: The 'O' Switch -->
  <g transform="translate(256, 256)">
    <!-- Outer Ring (The O) -->
    <circle r="120" fill="none" stroke="url(#neonGrad)" stroke-width="12" stroke-opacity="0.8" filter="url(#glow)" />
    
    <!-- Glass Shield overlay -->
    <circle r="120" fill="url(#glassGrad)" />

    <!-- Toggle Track -->
    <rect x="-70" y="-35" width="140" height="70" rx="35" fill="#0f172a" stroke="url(#neonGrad)" stroke-width="2" />
    
    <!-- Toggle Knob (Active State) -->
    <circle cx="35" cy="0" r="28" fill="#f8fafc" filter="url(#glow)" />
  </g>

  <!-- Corner Accent -->
  <path d="M 400 80 L 440 80 L 440 120" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-opacity="0.5" />
</svg>